name: CachyOS kernel binary cache (manual)

# Build only the selected RT-Bore-LTO kernel and publish that output's
# runtime closure. Do not cache the complete NixOS toplevel or unrelated
# packages: this keeps the project's 5 GB Cachix allocation focused on the
# custom kernel.
#
# One-time setup:
#   1. Create a PUBLIC Cachix cache named:
#      kumutuk-nixos-hyprland-vfio
#      (Managed by Cachix signing is recommended).
#   2. Create a cache write token and add it to GitHub Actions secrets as
#      CACHIX_AUTH_TOKEN.
#   3. After the first successful push, copy the cache's public signing key
#      from its Cachix dashboard into nixos/flake.nix and
#      nixos/hosts/nixos/configuration.nix to enable downloads.
#
# This workflow publishes only. It does not alter the kernel configuration,
# flake inputs, lock file, VFIO settings, or host-specific machine identity.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-push-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-kernel:
    name: Build and publish selected kernel only
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Verify Cachix write token is configured
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CACHIX_AUTH_TOKEN}" ]; then
            echo "::error::Add a Cachix write token as the CACHIX_AUTH_TOKEN GitHub Actions secret."
            exit 1
          fi
          echo "Cachix write token is present."

      - name: Report available disk space
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Build the configured RT-Bore-LTO kernel
        id: kernel
        working-directory: nixos
        run: |
          set -euo pipefail
          kernel_out="$(nix build --no-link --print-out-paths --show-trace \
            --no-update-lock-file \
            .#nixosConfigurations.nixos.config.boot.kernelPackages.kernel)"
          test -d "$kernel_out"
          printf 'Kernel output: %s\n' "$kernel_out"
          printf 'out=%s\n' "$kernel_out" >> "$GITHUB_OUTPUT"

      - name: Publish only the kernel output and its runtime closure
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kumutuk-nixos-hyprland-vfio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true
          useDaemon: false
          pathsToPush: ${{ steps.kernel.outputs.out }}

      - name: Verify the lock file was not rewritten
        run: |
          if ! git diff --quiet -- nixos/flake.lock; then
            echo "::error::flake.lock changed during the kernel cache build."
            git --no-pager diff -- nixos/flake.lock
            exit 1
          fi
          echo "  flake.lock clean"

      - name: Report remaining disk space
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
