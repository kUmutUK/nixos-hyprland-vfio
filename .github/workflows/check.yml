name: Nix Flake Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      # ---- GATE STEPS (must pass) ----

      - name: shellcheck
        # install.sh ve VFIO hook'u tarar. 2026-10-04'te gate'e alındı.
        # Önceden "REPORT STEPS" altında continue-on-error: true ile çalışıyordu,
        # yani bir regresyon CI'yi kırmıyordu. Gate'e çevirilmeden önce hook'taki
        # iki uyarı giderildi: kullanılmayan VFIO_PATH değişkeni (SC2034) ve
        # kullanılmayan döngü sayacı (SC2034).
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not preinstalled, installing…"
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -S warning install.sh nixos/hooks/qemu
          echo "  shellcheck OK"

      # home.nix içine GÖMÜLÜ 7 bash script'i var (wuwa-auto.sh, auto-translate.sh,
      # toggle-*.sh, mpvpaper-watchdog, waybar-temperature.sh, gamemode-notify).
      # Bunlar hiç taranmıyordu; 2026-10-05'te düzeltilen iki sessiz hata
      # (Nix kaçışı yüzünden `tr -d 'f'`, git'in okumadığı MANPAGER) tam olarak
      # bu boşluktan geçti. Aşağıdaki adım Nix indented-string'lerini çözup
      # betiği diske yazar, sonra shellcheck üzerinden geçirir.
      - name: Embedded home.nix scripts (shellcheck)
        # home.nix içine GÖMÜLÜ bash script'leri var (wuwa-auto.sh, auto-translate.sh,
        # toggle-*.sh, mpvpaper-watchdog, waybar-temperature.sh, gamemode-notify).
        # Bunlar hiç taranmıyordu; 2026-10-05'te düzeltilen iki sessiz hata tam
        # olarak bu boşluktan geçti (Nix kaçışı -> `tr -d 'f'`, git'in okumadığı
        # MANPAGER). scripts/extract-embedded-scripts.py Nix indented-string'lerini
        # çözüp betikleri diske yazar.
        run: |
          python3 scripts/extract-embedded-scripts.py /tmp/emb             | xargs -0 -n1 -- shellcheck -S warning
          echo "  embedded scripts OK"
