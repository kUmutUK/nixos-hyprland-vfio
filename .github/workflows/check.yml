name: Nix Flake Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: installer executable mode
        # Keep README's ./install.sh invocation working in fresh checkouts.
        run: |
          test -x install.sh
          mode="$(git ls-files -s -- install.sh | awk 'NR == 1 { print $1 }')"
          if [ "$mode" != "100755" ]; then
            echo "::error::install.sh must be stored in Git with mode 100755 (found: $mode)"
            exit 1
          fi
          echo "  install.sh executable mode OK"

      - name: source ZIP preserves Unix executable mode
        run: |
          archive="$(mktemp --suffix=.zip)"
          trap 'rm -f "$archive"' EXIT
          git archive --format=zip --prefix=nixos-hyprland-vfio/ \
            --output="$archive" HEAD
          python3 - "$archive" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              if any(name.startswith("nixos-hyprland-vfio/.git/") for name in names):
                  raise SystemExit(
                      "::error::Source ZIP must not include the repository's .git directory."
                  )
              entry = bundle.getinfo("nixos-hyprland-vfio/install.sh")
              mode = (entry.external_attr >> 16) & 0o777
              if entry.create_system != 3 or not (mode & 0o111):
                  raise SystemExit(
                      "::error::Source ZIP must retain install.sh's Unix executable mode "
                      f"(create_system={entry.create_system}, mode={mode:04o})."
                  )
          print("  source ZIP excludes .git and retains install.sh executable mode")
          PY

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: XML well-formedness and VM invariants
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('vm-xml/win10.xml')"
          python3 scripts/test-vm-xml.py

      - name: Installer, English locale, global Reflex and SSH regression checks
        run: bash scripts/test-installer-invariants.sh

      - name: Installer partial-deployment rollback regression test
        run: bash scripts/test-installer-rollback.sh

      # ---- GATE STEPS (must pass) ----

      - name: shellcheck
        # Checks install.sh and the VFIO hook. Promoted to a required gate on 2026-10-04.
        # It previously ran under "REPORT STEPS" with continue-on-error: true,
        # so regressions did not fail CI. Before making it a gate, the hook's
        # two ShellCheck warnings were fixed: unused VFIO_PATH (SC2034) and
        # an unused loop counter (SC2034).
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not preinstalled, installing…"
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -S warning install.sh nixos/hooks/qemu scripts/test-vfio-hook-driver-state.sh scripts/test-installer-invariants.sh scripts/test-installer-rollback.sh
          echo "  shellcheck OK"

      - name: VFIO hook driver-state regression tests
        run: bash scripts/test-vfio-hook-driver-state.sh

      - name: ShellCheck of the Nix-generated VFIO hook
        # The source hooks/qemu was checked separately; this also checks the
        # Nix-interpolated writeShellScript wrapper from configuration.nix.
        # Only the small hook derivation is built, not the full NixOS system.
        working-directory: nixos
        run: |
          hook_path="$(nix build --no-link --no-update-lock-file --print-out-paths \
            .#nixosConfigurations.nixos.config.virtualisation.libvirtd.hooks.qemu.vfio)"
          test -f "$hook_path"
          shellcheck -S warning "$hook_path"
          echo "  generated VFIO hook OK"

      - name: Embedded home.nix scripts (shellcheck)
        # home.nix contains embedded Bash scripts (wuwa-auto.sh, auto-translate.sh,
        # toggle-*.sh, mpvpaper-watchdog, waybar-temperature.sh, gamemode-notify).
        # They were not checked previously; two silent regressions fixed on 2026-10-05
        # came through this gap (Nix escaping changed `tr -d '\f'`, and Git ignored
        # MANPAGER). scripts/extract-embedded-scripts.py resolves Nix indented strings
        # and writes the scripts to disk.
        run: |
          # `-r` (--no-run-if-empty) is required: GNU xargs runs the command with no arguments
          # once when input is empty. Measured with GNU xargs 4.9.0 and ShellCheck 0.9.0:
          #   printf '' | xargs -0    -n1 -- shellcheck  → exit 123
          #     (ShellCheck prints usage and exits 3 when no file argument is supplied;
          #      this fails loudly rather than being a silent false positive)
          #   printf '' | xargs -0 -r -n1 -- shellcheck  → no invocation, exit 0
          # With this ShellCheck version the empty-input trap fails loudly, not silently.
          # This step still closes the coverage gap: if extraction breaks, it must not
          # report success without checking any scripts.
          # The old comment claimed ShellCheck read empty stdin and returned 0, leaving CI green.
          # That claim was version-dependent and is false for the measured version.
          # Re-check if this behavior changes in a future tool version.
          python3 scripts/extract-embedded-scripts.py /tmp/emb \
            | xargs -0 -r -n1 -- shellcheck -S warning
          # This expected count prevents CI passing if the extractor misses a marker.
          # Update the expected count whenever an embedded script is intentionally added or removed.
          n=$(find /tmp/emb -maxdepth 1 -name '*.sh' -type f 2>/dev/null | wc -l)
          if [ "$n" -ne 7 ]; then
            echo "::error::Expected 7 embedded scripts in home.nix, found $n. Check extractor markers and the expected count."
            exit 1
          fi
          echo "  embedded scripts OK ($n/7)"

      # ---- THE GATE THIS REPO WAS ACTUALLY MISSING ----
      # The workflow was named "Nix Flake Check" but did not invoke Nix at all:
      # it ran only ShellCheck. Many changelog fixes concern Nix options, paths,
      # and ABI/version mismatches, but none were gated by evaluation.
      # A single typo such as `xwayland.enable` vs `xwaylan.enable` could
      # therefore merge and break a user's rebuild.

      #
      # Nix is already installed above; this step now actually invokes it.
      # --no-build evaluates the module system without building outputs.
      #   This is appropriate here: low_latency_layer may require a local build,
      #   making a full system build slow without adding value to option checks.

      - name: nix flake check (eval only)
        working-directory: nixos
        run: |
          # `--accept-flake-config` was removed here because it can cause the flake's
          # nixConfig.extra-substituters / extra-trusted-public-keys settings to be
          # applied while rewriting the lock file. Observed side effects included:
          #   • Updated input 'impermanence/home-manager' → follows 'home-manager'
          #   - Node names shifting (nixpkgs_3 → nixpkgs_2)
          #   - Input syntax changing ("home-manager": "home-manager"
          #     → ["home-manager"])
          # `--option warn-dirty false` hid the warning, so the mutation
          # was not obvious and left the checkout dirty after each run.
          #
          # Removing `--accept-flake-config` alone is not sufficient.
          # The root cause was a non-canonical committed flake.lock.
          # The same impermanence input was represented in two different forms:
          #     "nixpkgs":     ["nixpkgs"]   (follows form)
          #     "home-manager": "home-manager" (string form)
          # Nix canonicalizes the lock during evaluation, so running
          # `nix flake check` changed the file.
          # The fix was to canonicalize and commit the lock file; the guard below
          # detects future regressions.

          #
          # Substituters and trusted keys are unnecessary here: --no-build only
          # evaluates the flake and does not download build inputs. Without
          # `--accept-flake-config`, the flake nixConfig is treated as untrusted.
          nix flake check --no-build --show-trace \
            --no-update-lock-file \
            --option warn-dirty false
          echo "  flake evaluates OK"

      # This is an informational step, not a required gate. Required gates are:
      #   1) ShellCheck (install.sh + nixos/hooks/qemu)
      #   2) embedded home.nix script checks
      #   3) nix flake check (evaluation only), which catches option errors
      #   4) flake.lock unchanged
      # statix and deadnix findings are logged but do not fail the workflow by design:
      # failing a PR on every advisory finding would be noisy for a configuration repository.
      # `|| echo` returns success after an advisory warning; this is not a pipeline,
      # so `pipefail` is irrelevant and the fallback masks the command exit code.
      # `nix develop` here intentionally is not `--no-build`.
      # The devShell tools (nixfmt, statix, deadnix, ShellCheck, jq, etc.) are
      # cached; this step does not build custom kernel or low-latency-layer sources.
      # `--no-build` is used in the previous step because `nix flake check` only
      # needs to evaluate the module system there.
      - name: statix / deadnix (repository .nix files) - informational
        run: |
          # P3: the previous version used an unlocked nixpkgs (nixpkgs#statix),
          # potentially producing different results for the same commit. It now uses
          # the flake devShell and its locked revision.
          nix --extra-experimental-features "nix-command flakes" \
            develop ./nixos --no-update-lock-file --command statix check . \
            || echo "::warning::statix findings present (informational only)"
          nix --extra-experimental-features "nix-command flakes" \
            develop ./nixos --no-update-lock-file --command deadnix . \
            || echo "::warning::deadnix findings present (informational only)"

      # Detect lock-file drift permanently
      # Keep this step last. Any step that evaluates the flake, including `nix develop`,
      # could rewrite the lock file. `--no-update-lock-file` is set on current Nix steps,
      # but future workflow edits may forget it. If a later step can mutate the lock,
      # the guard must run after it; otherwise non-canonical state can be missed.


      - name: flake.lock unchanged
        working-directory: nixos
        run: |
          if ! git diff --quiet -- flake.lock; then
            echo "::error::flake.lock changed during CI; lock file is not canonical. Run `nix flake lock` and commit the result."
            git --no-pager diff -- flake.lock
            exit 1
          fi
          echo "  flake.lock clean"
