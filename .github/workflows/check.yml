name: Nix Flake Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# İlk açılışta tek bir adım bile kırmızıya dönmesin diye varsayılan:
# yalnızca "block" etiketli adımlar kapı görevi görür.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        # Branch değil, commit SHA'sı. Yenilemek için:
        #   gh api repos/DeterminateSystems/nix-installer-action/commits --jq '.[0].sha'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      # ── KAPI ADIMLARI (yeşil olmadan iş kırmızı) ──────────────────

      - name: Nix syntax check (parse)
        # Sadece ayrıştırma, değerlendirme yok — hızlı ve her zaman güvenilir.
        run: |
          cd nixos
          for f in *.nix; do
            echo "  parsing $f"
            nix-instantiate --parse "$f" > /dev/null
          done

      - name: XML doğrulama
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('vm-xml/win10.xml'); print('  win10.xml OK')"

      - name: Silinen stale dosyalar geri gelmiş mi?
        # Bu repo iki kaynaklı config'ler taşıyordu (.config/, waybar/, gtk/,
        # kökteki JSON/TOML) ve bunlar home.nix'in inline kopyalarıyla
        # drift etmişti. home.nix tek doğruluk kaynağı.
        run: |
          fail=0
          for f in .config waybar gtk low_latency_layer.json \
                   VkLayer_LS_frame_generation.json etc conf.toml MangoHud.conf; do
            if [ -e "$f" ]; then
              echo "::error file=$f::stale dosya geri gelmiş"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "  stale dosya yok"
          exit $fail

      - name: flake check (değerlendirme, derleme değil)
        # --no-build: nixosConfigurations için yalnızca EVALUATE eder.
        # Derleme olsaydı CI saatlerce sürer ve GB'larca indirme yapardı.
        # Buradaki değer: opsiyon/attribute hatalarını yakalamak.
        run: |
          cd nixos
          nix flake check --no-build --show-trace

      # ── BİLGİLENDİRME ADIMLARI (raporlar, bloklamaz) ──────────────
      # Bu kod tabanı daha önce hiç lint'lenmemişti; mevcut uyarılar
      # kalıcı teknik borç. Önce görünür olsun, sonra temizlensin.

      - name: statix (bilgilendirme)
        continue-on-error: true
        run: |
          cd nixos
          nix run nixpkgs#statix -- check . || echo "::warning::statix uyarıları var (temizlenmemiş)"

      - name: deadnix (bilgilendirme)
        continue-on-error: true
        run: |
          cd nixos
          nix run nixpkgs#deadnix -- . || echo "::warning::deadnix: kullanılmayan bağlar var"

      - name: shellcheck (bilgilendirme)
        continue-on-error: true
        run: |
          shellcheck -S warning install.sh nixos/hooks/qemu \
            || echo "::warning::shellcheck uyarıları var (temizlenmemiş)"

      - name: Kurulum sırası sabitleri
        # install.sh / KURULUM.md / README aynı flake yolunu vermeli,
        # yoksa biri diğerinin oluşturmadığı bir dizini gösterir.
        run: |
          expected="/etc/nixos/nixos#nixos"
          for f in install.sh KURULUM.md README.md nixos/home.nix; do
            grep -q -- "$expected" "$f" || { echo "::error file=$f::$expected yolu yok"; exit 1; }
          done
          echo "  flake yolu tutarlı: $expected"

      - name: hardware-configuration.nix konumu hatırlatması
        run: |
          echo "::notice::Bu dosya makineye özeldir; flake'in yanına elle konmalı:"
          echo "::notice::  sudo cp /etc/nixos/hardware-configuration.nix /etc/nixos/nixos/"
