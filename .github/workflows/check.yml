name: Nix Flake Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        # Artık branch yerine commit SHA'sına sabitlendi (detsys-pr-bot,
        # 2026-09-09). Yeni SHA'sını üretmek için:
        #   gh api repos/DeterminateSystems/nix-installer-action/commits --jq '.[0].sha'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aac0

      - name: Nix syntax check (parse)
        run: |
          cd nixos
          for f in *.nix; do
            echo "  parsing $f"
            nix-instantiate --parse "$f" > /dev/null
          done

      - name: Statix lint
        run: |
          cd nixos
          nix run nixpkgs#statix -- check .

      - name: deadnix check
        run: |
          cd nixos
          nix run nixpkgs#deadnix -- .

      - name: ShellCheck (shell scriptleri)
        run: |
          shellcheck -S warning install.sh
          shellcheck -S warning nixos/hooks/qemu

      - name: XML / JSON doğrulama
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('vm-xml/win10.xml'); print('  win10.xml OK')"

      - name: Silinen stale dosyalara referans kontrolü
        # Bu repo tarihsel olarak iki kaynaklı config'ler taşıyordu
        # (.config/, waybar/, gtk/, kökteki JSON'lar) ve bunlar home.nix'in
        # inline kopyalarıyla drift etmişti. home.nix tek doğruluk kaynağı.
        run: |
          for f in .config waybar gtk low_latency_layer.json \
                   VkLayer_LS_frame_generation.json etc conf.toml MangoHud.conf; do
            if [ -e "$f" ]; then
              echo "::error file=$f::stale dosya geri gelmiş"
              exit 1
            fi
          done
          echo "  stale dosya yok"

      - name: flake check
        run: |
          cd nixos
          nix flake check
