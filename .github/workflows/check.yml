name: Nix Flake Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: installer executable mode
        # Keep README's ./install.sh invocation working in fresh checkouts.
        run: |
          test -x install.sh
          mode="$(git ls-files -s -- install.sh | awk 'NR == 1 { print $1 }')"
          if [ "$mode" != "100755" ]; then
            echo "::error::install.sh must be stored in Git with mode 100755 (found: $mode)"
            exit 1
          fi
          echo "  install.sh executable mode OK"

      - name: create and validate canonical source ZIP
        run: |
          archive="$RUNNER_TEMP/nixos-hyprland-vfio-source.zip"
          rm -f "$archive"
          git archive --format=zip --prefix=nixos-hyprland-vfio/ \
            --output="$archive" HEAD
          python3 - "$archive" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              if any(name.startswith("nixos-hyprland-vfio/.git/") for name in names):
                  raise SystemExit(
                      "::error::Source ZIP must not include the repository's .git directory."
                  )
              entry = bundle.getinfo("nixos-hyprland-vfio/install.sh")
              mode = (entry.external_attr >> 16) & 0o777
              if entry.create_system != 3 or not (mode & 0o111):
                  raise SystemExit(
                      "::error::Source ZIP must retain install.sh's Unix executable mode "
                      f"(create_system={entry.create_system}, mode={mode:04o})."
                  )
          print("  source ZIP excludes .git and retains install.sh executable mode")
          PY

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Validate pinned flake lock graph
        # Catch missing direct/transitive input nodes before Nix runs with
        # --no-update-lock-file (the exact Serpantinum CI failure from 2026-10-23).
        run: python3 scripts/test-flake-lock.py

      - name: Complete lock metadata for immutable inputs
        # The Serpantinum commit is pinned in flake.nix. Let Nix calculate its
        # content hash instead of fabricating a narHash. Existing locked inputs
        # are retained; this step fills derived lock metadata before read-only builds.
        working-directory: nixos
        run: |
          nix flake lock
          python3 ../scripts/test-flake-lock.py

      - name: XML well-formedness and VM invariants
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('vm-xml/win10.xml')"
          python3 scripts/test-vm-xml.py
          python3 scripts/test-vm-xml-sync.py
          python3 scripts/test-vm-diagnostic.py

      - name: Installer, English locale, global Reflex and SSH regression checks
        run: bash scripts/test-installer-invariants.sh

      - name: Installer partial-deployment rollback regression test
        run: bash scripts/test-installer-rollback.sh

      # ---- GATE STEPS (must pass) ----

      - name: shellcheck
        # Checks install.sh and the VFIO hook. Promoted to a required gate on 2026-10-04.
        # It previously ran under "REPORT STEPS" with continue-on-error: true,
        # so regressions did not fail CI. Before making it a gate, the hook's
        # two ShellCheck warnings were fixed: unused VFIO_PATH (SC2034) and
        # an unused loop counter (SC2034).
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not preinstalled, installing…"
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -S warning install.sh nixos/hooks/qemu scripts/serpantinum-wallpaper-picker scripts/test-vfio-hook-driver-state.sh scripts/test-installer-invariants.sh scripts/test-installer-rollback.sh
          echo "  shellcheck OK"

      - name: Serpantinum wallpaper helper syntax
        run: bash -n scripts/serpantinum-wallpaper-picker

      - name: VFIO hook driver-state regression tests
        run: bash scripts/test-vfio-hook-driver-state.sh

      - name: ShellCheck of the Nix-generated VFIO hook
        # The source hooks/qemu was checked separately; this also checks the
        # Nix-interpolated writeShellScript wrapper from configuration.nix.
        # Only the small hook derivation is built, not the full NixOS system.
        working-directory: nixos
        run: |
          hook_path="$(nix build --no-link --no-update-lock-file --print-out-paths \
            .#nixosConfigurations.nixos.config.virtualisation.libvirtd.hooks.qemu.vfio)"
          test -f "$hook_path"
          shellcheck -S warning "$hook_path"
          echo "  generated VFIO hook OK"

      - name: Embedded-script extractor regression tests
        run: python3 scripts/test-extract-embedded-scripts.py

      - name: Embedded home.nix scripts (shellcheck)
        # home.nix contains embedded Bash scripts (wuwa-auto.sh, auto-translate.sh,
        # toggle-*.sh, mpvpaper-watchdog, waybar-temperature.sh, gamemode-notify).
        # They were not checked previously; two silent regressions fixed on 2026-10-05
        # came through this gap (Nix escaping changed `tr -d '\f'`, and Git ignored
        # MANPAGER). scripts/extract-embedded-scripts.py resolves Nix indented strings
        # and writes the scripts to disk.
        run: |
          set -euo pipefail
          # Use a fresh directory so stale files cannot make the expected-count
          # assertion pass. Capture extractor output to a file so its exit status
          # is checked directly rather than potentially masked by a downstream pipe.
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python3 scripts/extract-embedded-scripts.py "$tmpdir" > "$tmpdir/paths.nul"
          mapfile -d '' -t embedded_scripts < "$tmpdir/paths.nul"
          n="${#embedded_scripts[@]}"
          # Update this count only when an embedded Bash script is intentionally added or removed.
          if [ "$n" -ne 7 ]; then
            echo "::error::Expected 7 embedded scripts in home.nix, found $n. Check extractor markers and the expected count."
            exit 1
          fi
          shellcheck -S warning "${embedded_scripts[@]}"
          echo "  embedded scripts OK ($n/7)"

      # ---- THE GATE THIS REPO WAS ACTUALLY MISSING ----
      # The workflow was named "Nix Flake Check" but did not invoke Nix at all:
      # it ran only ShellCheck. Many changelog fixes concern Nix options, paths,
      # and ABI/version mismatches, but none were gated by evaluation.
      # A single typo such as `xwayland.enable` vs `xwaylan.enable` could
      # therefore merge and break a user's rebuild.

      #
      # Nix is already installed above; this step now actually invokes it.
      # --no-build evaluates the module system without building outputs.
      #   This is appropriate here: low_latency_layer may require a local build,
      #   making a full system build slow without adding value to option checks.

      - name: nix flake check (eval only)
        working-directory: nixos
        run: |
          # Keep `--accept-flake-config` disabled: CI should not silently trust
          # binary-cache configuration from an input flake. The metadata-only
          # `nix flake lock` step above resolves the fixed Serpantinum source before
          # these read-only checks; no input is deliberately updated here.
          # The bottom drift guard permits only that source's computed narHash and
          # lastModified fields and rejects any unrelated lock-file mutation.

          # Substituters and trusted keys are unnecessary here: --no-build only
          # evaluates the flake and does not download build inputs. Without
          # `--accept-flake-config`, the flake nixConfig is treated as untrusted.
          nix flake check --no-build --show-trace \
            --no-update-lock-file \
            --option warn-dirty false
          echo "  flake evaluates OK"

      # This is an informational step, not a required gate. The required gates above
      # and below include:
      #   1) install.sh is executable in Git and the source ZIP preserves its mode
      #      while excluding the repository's .git directory
      #   2) every lock-graph edge resolves and Serpantinum's direct/transitive inputs are pinned
      #   3) VM XML is well-formed and the XML/diagnostic invariant tests pass
      #   4) installer invariants and partial-deployment rollback regression tests
      #   5) ShellCheck for install.sh, wallpaper helper, source VFIO hook, and test scripts
      #   6) the wallpaper helper has valid Bash syntax
      #   7) VFIO hook driver-state regression tests
      #   8) ShellCheck for the Nix-generated VFIO hook
      #   9) extraction and ShellCheck of all seven embedded home.nix scripts
      #  10) nix flake check evaluates the NixOS configuration without building it
      #  11) flake.lock has no unexpected drift beyond derived Serpantinum hash metadata
      # statix and deadnix findings are logged but do not fail the workflow by design:
      # failing a PR on every advisory finding would be noisy for a configuration repository.
      # `|| echo` returns success after an advisory warning; this is not a pipeline,
      # so `pipefail` is irrelevant and the fallback masks the command exit code.
      # `nix develop` here intentionally is not `--no-build`.
      # The devShell tools (nixfmt, statix, deadnix, ShellCheck, jq, etc.) are
      # cached; this step does not build custom kernel or low-latency-layer sources.
      # `--no-build` is used in the previous step because `nix flake check` only
      # needs to evaluate the module system there.
      - name: statix / deadnix (repository .nix files) - informational
        run: |
          # P3: the previous version used an unlocked nixpkgs (nixpkgs#statix),
          # potentially producing different results for the same commit. It now uses
          # the flake devShell and its locked revision.
          nix --extra-experimental-features "nix-command flakes" \
            develop ./nixos --no-update-lock-file --command statix check . \
            || echo "::warning::statix findings present (informational only)"
          nix --extra-experimental-features "nix-command flakes" \
            develop ./nixos --no-update-lock-file --command deadnix . \
            || echo "::warning::deadnix findings present (informational only)"

      # Detect unexpected lock-file drift. The only permitted generated difference
      # is the narHash/lastModified metadata Nix calculates for the immutable
      # Serpantinum Git commit; any other change means a real lock update is needed.
      # Keep this guard after all Nix commands, including `nix develop`.
      - name: flake.lock drift guard
        working-directory: nixos
        run: |
          python3 - <<'PYLOCK'
          import copy
          import json
          import subprocess
          import sys
          from pathlib import Path

          baseline = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:nixos/flake.lock"], text=True
          ))
          current = json.loads(Path("flake.lock").read_text(encoding="utf-8"))

          def normalized(lock):
              value = copy.deepcopy(lock)
              locked = value["nodes"]["serpantinum"]["locked"]
              # Nix derives these from the pinned Git revision at lock time.
              locked.pop("narHash", None)
              locked.pop("lastModified", None)
              return value

          if normalized(current) != normalized(baseline):
              print("::error::Unexpected flake.lock drift beyond calculated Serpantinum metadata.", file=sys.stderr)
              subprocess.run(["git", "--no-pager", "diff", "--", "flake.lock"], check=False)
              raise SystemExit(1)
          print("  flake.lock stable; only Nix-derived Serpantinum metadata may be filled at CI time")
          PYLOCK

      # Upload the exact ZIP validated above, only after all required checks pass.
      # The artifact contains the source ZIP as a file; its inner ZIP preserves
      # the Unix executable bit and excludes .git.
      - name: upload validated source ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nixos-hyprland-vfio-source
          path: ${{ runner.temp }}/nixos-hyprland-vfio-source.zip
          if-no-files-found: error
          retention-days: 14
