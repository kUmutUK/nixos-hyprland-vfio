name: Nix Flake Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      # ---- GATE STEPS (must pass) ----

      - name: shellcheck
        # install.sh ve VFIO hook'u tarar. 2026-10-04'te gate'e alındı.
        # Önceden "REPORT STEPS" altında continue-on-error: true ile çalışıyordu,
        # yani bir regresyon CI'yi kırmıyordu. Gate'e çevirilmeden önce hook'taki
        # iki uyarı giderildi: kullanılmayan VFIO_PATH değişkeni (SC2034) ve
        # kullanılmayan döngü sayacı (SC2034).
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not preinstalled, installing…"
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -S warning install.sh nixos/hooks/qemu
          echo "  shellcheck OK"

      - name: Embedded home.nix scripts (shellcheck)
        # home.nix içine GÖMÜLÜ bash script'leri var (wuwa-auto.sh, auto-translate.sh,
        # toggle-*.sh, mpvpaper-watchdog, waybar-temperature.sh, gamemode-notify).
        # Bunlar hiç taranmıyordu; 2026-10-05'te düzeltilen iki sessiz hata tam
        # olarak bu boşluktan geçti (Nix kaçışı -> `tr -d 'f'`, git'in okumadığı
        # MANPAGER). scripts/extract-embedded-scripts.py Nix indented-string'lerini
        # çözüp betikleri diske yazar.
        #
        # ⚠️ DÜZELTME (2026-10-08): bu adım BOŞ LİSTEYİ sessizce geçiyordu.
        #
        #   python3 ...extract-embedded-scripts.py /tmp/emb | xargs -0 -n1 -- shellcheck -S warning
        #
        # 1) xargs'ta `-r` / `--no-run-if-empty` YOKTU. Boş girdide xargs komutu
        #    SIFIR ARGÜMANLA bir kez çalıştırır: shellcheck dosya adı almayınca
        #    stdin'i okur, pipe zaten boşaldığı için temiz çıkar, exit 0 döner.
        # 2) Bu step'te `shell:` anahtarı tanımlı DEĞİL, yani GitHub Actions'ın
        #    varsayılanı `bash -e {0}` — PIPEFAIL YOK. (`shell: bash` yazılsaydı
        #    `bash -eo pipefail` olurdu.) Yani extractor'ın ÇÖKMESİ de aynı
        #    şekilde yutuluyordu; sadece sol taraf `set -e` ile korunmuyor.
        #
        # Sonuç: home.nix'teki `hypr/scripts/...` desenleri bir refactor'da
        # kayarsa extractor 0 betik bulup mutlu mesut çıkıyor, `echo "OK"`
        # basıyor, kapı YEŞİL kalıyor ve HİÇBİR ŞEY taranmamış oluyordu.
        # Tam olarak bu kapının yakalamak için kurulduğu hata sınıfı.
        #
        # Düzeltme: (a) `shell: bash` ile pipefail açık, (b) boş çıktı ve
        # (c) minimum betik sayısı açıkça reddediliyor, (d) xargs `-r` alıyor.
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t EMBEDDED < <(python3 scripts/extract-embedded-scripts.py /tmp/emb)
          COUNT="${#EMBEDDED[@]}"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::home.nix içinden hiç gömülü bash betiği çıkarılamadı (0 betik)."
            echo "::error::extract-embedded-scripts.py marker'ları home.nix ile uyuşmuyor —"
            echo "::error::kapı sessizce hiçbir şey taramadan geçmesin diye BİLEREK kırıldı."
            exit 1
          fi
          if [ "$COUNT" -lt 7 ]; then
            echo "::warning::gömülü betik sayısı $COUNT (önceden 7 idi)."
            echo "::warning::home.nix'den betik silinmiş olabilir ya da marker kaçmış olabilir."
          fi
          printf '%s\0' "${EMBEDDED[@]}" | xargs -0 -r -n1 -- shellcheck -S warning
          echo "  embedded scripts OK ($COUNT betik tarandı)"

      # ---- THE GATE THIS REPO WAS ACTUALLY MISSING ----
      # Workflow'un adı "Nix Flake Check" idi ama içinde TEK SATIR Nix yoktu:
      # yalnızca shellcheck çalışıyordu. Bu repo'nun CHANGELOG'unun tamamı
      # option seviyesinde düzeltmelerden oluşuyor (olmayan option, yanlış yol,
      # ABI/sürüm kayması) ve HİÇBİRİ kapı altında değildi. Tek bir yazım
      # hatası -- `xwayland.enable` yerine `xwaylan.enable` gibi -- sessizce
      # merge olup kullanıcının rebuild'ini kırıyordu.
      #
      # Nix zaten yukarıda kuruluyordu, sadece hiç çağrılmıyordu.
      # --no-build: derleme yapmaz, yalnızca tüm modül sistemini EVAL eder.
      #   Bu repo için doğru seçim: low_latency_layer cachix'te yok, ilk
      #   kurulumda kaynaktan derlendiği için full build CI'ı dakikalarca
      #   meşgul ederdi ve option hatalarını yakalamazdı.
      - name: nix flake check (eval only)
        working-directory: nixos
        run: |
          # DÜZELTME: burada `--accept-flake-config` vardı. O bayrak, flake'in
          # nixConfig.extra-substituters / extra-trusted-public-keys ayarlarını
          # uygularken LOCK DOSYASINI DA yeniden yazıyordu. Gözlemlenen yan etki:
          #   • Updated input 'impermanence/home-manager' → follows 'home-manager'
          #   node isimleri kayıyor (nixpkgs_3 → nixpkgs_2)
          #   gösterim biçimi değişiyor ("home-manager": "home-manager"
          #     → ["home-manager"])
          # `--option warn-dirty false` bunu sessizce bastırdığı için kimse
          # fark etmiyordu — CI her çalışmada repo'yu kirli bırakıyordu.
          #
          # ⚠️ `--accept-flake-config` KALDIRILMASI TEK BAŞINA YETMEZ.
          # Asıl kök neden: commit'lenmiş flake.lock KANONİK DEĞİLDİ.
          # impermanence.inputs içinde aynı kayıt iki FARKLI biçimde yazılmıştı:
          #     "nixpkgs":     ["nixpkgs"]   ← follows formu (doğru)
          #     "home-manager": "home-manager" ← string formu (yanlış)
          # Nix her değerlendirmede lock'u kanonikleştirdiği için, yeni bir
          # `nix flake check` ÇALIŞTIRILDIĞI AN dosya değişiyordu.
          # Kalıcı çözüm: lock'u kanonik hale getirip commit'lemek (aşağıdaki
          # commit'te yapıldı). Aşağıdaki guard step, ileride tekrar bozulursa
          # sessizce kaymasını yakalar.
          #
          # substituters/trusted-keys BURAYA gerekmez: --no-build yalnızca
          # EVAL eder, indirme yapmaz. (Ayrıca --accept-flake-config olmadan
          # flake'in nixConfig'i zaten "untrusted" sayılıp yok sayılıyor.)
          nix flake check --no-build --show-trace \
            --option warn-dirty false
          echo "  flake evaluates OK"

      # KİLİT SÜRÜKLENMESİNİ KALICI OLARAK YAKALA
      - name: flake.lock unchanged
        working-directory: nixos
        run: |
          if ! git diff --quiet -- flake.lock; then
            echo "::error::flake.lock CI çalışması sırasında değişti — lock kanonik değil. 'nix flake lock' çalıştırıp commit'leyin."
            git --no-pager diff -- flake.lock
            exit 1
          fi
          echo "  flake.lock clean"

      # flake'in DEĞERLENDİRİLDİĞİ doğrulanır: bir option yanlış yazılmışsa
      # ("services.lsfg-vk", "systemd.tmpfiles.rules", impermanence modülü)
      # burada düşer. impermanence'in "Neither /var/lib/nixos nor any of its
      # parents are persisted" uyarısı GÜRÜLTÜDÜR ve bu adımı kırmaz.
      - name: statix / deadnix (repo kökü .nix dosyaları)
        run: |
          # P3: önceki hâli KİLİTLENMEMİŞ nixpkgs çekiyordu (nixpkgs#statix),
          # yani aynı commit'te farklı sonuç verebilirdi. Artık flake'in kendi
          # devShell'inden, kilitli rev ile çalışıyor.
          nix --extra-experimental-features "nix-command flakes" \
            develop ./nixos --command statix check . \
            || echo "::warning::statix bulguları var (gate değil)"
          nix --extra-experimental-features "nix-command flakes" \
            develop ./nixos --command deadnix . \
            || echo "::warning::deadnix bulguları var (gate değil)"
