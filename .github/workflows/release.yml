name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "New, unused stable version tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      target_host_validated:
        description: >-
          I confirm that the post-build system changes are deployed on the
          reference host and that a clean installation, boot, Windows VM
          start/shutdown, GPU handback, and Hyprland recovery were verified.
          This is a maintainer attestation, not a GitHub build result.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_VERSION"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Only stable vMAJOR.MINOR.PATCH versions are accepted."
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$(git rev-list -n 1 "$release_tag")" = "$GITHUB_SHA"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
              echo "::error::Tag $release_tag already exists."
              exit 1
            fi
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            existing_commit_tags="$(
              git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' |
                grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
                sort -V || true
            )"
            if [[ -n "$existing_commit_tags" ]]; then
              echo "::error::Commit $GITHUB_SHA already has stable release tag(s): $existing_commit_tags. Create a new commit before publishing another version."
              exit 1
            fi
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release commit must be reachable from main."
            exit 1
          fi

      - name: Require successful CI and a current-enough full-system build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_HOST_VALIDATED: ${{ inputs.target_host_validated }}
        run: |
          set -Eeuo pipefail

          ci_runs="$(gh run list \
            --workflow check.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --json headSha,headBranch,status,conclusion \
            --limit 100)"

          if ! jq -e --arg sha "$GITHUB_SHA" '
            any(.[]; .headSha == $sha
              and .headBranch == "main"
              and .status == "completed"
              and .conclusion == "success")
          ' <<< "$ci_runs" >/dev/null; then
            echo "::error::Normal CI has not passed for this exact main commit."
            exit 1
          fi
          echo "  normal CI passed for $GITHUB_SHA"

          build_runs="$(gh run list \
            --workflow full-system-build.yml \
            --branch main \
            --json headSha,headBranch,status,conclusion \
            --limit 100)"

          build_sha=""
          while IFS= read -r candidate; do
            if git cat-file -e "$candidate^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"; then
              build_sha="$candidate"
              break
            fi
          done < <(
            jq -r '.[] | select(.headBranch == "main"
              and .status == "completed"
              and .conclusion == "success") | .headSha' <<< "$build_runs"
          )

          if [[ -z "$build_sha" ]]; then
            echo "::error::No successful full-system build exists on an ancestor of this main commit."
            exit 1
          fi

          # A previous full-system build remains valid only when every later
          # changed path matches the exact literal allowlist documented in RELEASING.md.
          unexpected=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              .git-cliff.toml|RELEASING.md|README.md|INSTALLATION.md|DEGISIKLIK_GECMISI.md|CONTRIBUTING.md|CHANGELOG.md|DISCLAIMER.md|docs/REPAIR-AND-VALIDATION-REPORT.md|docs/UUID-AND-MACHINE-IDENTITY.md|docs/OPTISCALER.md|docs/OPTISCALER-MANAGER.md|docs/MAKO.md|docs/archive/DEGISIKLIK_GECMISI.md|docs/archive/README.md|docs/archive/HISTORICAL-AUDITS.md|scripts/check-home-snapper-layout.py|scripts/test-home-snapper-layout.py|scripts/check-vm-iso-paths.py|scripts/test-vm-iso-paths.py|scripts/test-vm-xml.py|scripts/test-vm-xml-structure.py|scripts/extract-embedded-scripts.py|scripts/test-extract-embedded-scripts.py|scripts/test-mako-renderer.py|scripts/optiscaler_manager.py|scripts/test-optiscaler-manager.py|scripts/sync-vm-xml.py|scripts/test-vm-xml-sync.py|scripts/test-manual-vm-bootstrap.sh|scripts/test-installer-invariants.sh|scripts/test-vfio-hook-driver-state.sh|scripts/test-documentation-integrity.py|scripts/test-release-workflow-python.py|scripts/test-lsfg-vk-v2.py|scripts/prepare-vm-diagnostic.py|scripts/test-vm-diagnostic.py|scripts/test-vm-xml-paths.py|scripts/test-installer-rollback.sh|.github/workflows/check.yml|.github/workflows/kernel-build.yml|.github/workflows/release.yml)
                ;;
              *)
                echo "::error::Full-system build is older and $path changed afterwards."
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only "$build_sha" "$GITHUB_SHA")

          manual_host_attestation=0
          if [[ "$unexpected" -ne 0 ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
              && "$GITHUB_REF" == "refs/heads/main" \
              && "$TARGET_HOST_VALIDATED" == "true" ]]; then
              manual_host_attestation=1
              echo "::warning::Non-allowlisted post-build changes accepted by explicit target-host validation attestation."
              echo "::notice::Maintainer attested target-host validation for exact commit $GITHUB_SHA."
            else
              echo "::error::Run a new full-system build after the system-affecting changes, or use manual Release on main with target-host validation attested."
              exit 1
            fi
          fi

          echo "  successful full-system build baseline: $build_sha"
          if [[ "$manual_host_attestation" -eq 1 ]]; then
            echo "  post-build changes accepted by manual target-host validation attestation"
          else
            echo "  changes since that build match the exact release-only allowlist"
          fi

      - name: Find previous version tag
        id: previous
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          previous_tag="$(
            git tag --merged "$GITHUB_SHA" --list 'v[0-9]*' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              grep -Fvx "$RELEASE_TAG" |
              sort -V |
              tail -n 1 || true
          )"
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes with git-cliff
        if: steps.previous.outputs.tag != ''
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: .git-cliff.toml
          # A pushed tag is already at HEAD; manual dispatch runs on main before creating its new tag.
          args: ${{ github.event_name == 'push' && '--current --strip header' || format('{0}..{1} --tag {2} --strip header', steps.previous.outputs.tag, github.sha, steps.release.outputs.tag) }}
          github_token: ${{ github.token }}
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Use curated notes for the first tagged release
        if: steps.previous.outputs.tag == ''
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/release-notes.md" <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          import re
          import sys

          source = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"(?m)^## \[Unreleased\]\s*\n", source)
          if match is None:
              raise SystemExit("CHANGELOG.md has no ## [Unreleased] section.")
          body = source[match.end():]
          next_section = re.search(r"(?m)^## ", body)
          if next_section is not None:
              body = body[:next_section.start()]
          body = body.strip()
          if not body:
              raise SystemExit("The curated [Unreleased] section is empty.")
          release_date = datetime.now(timezone.utc).date().isoformat()
          heading = f"## {os.environ['RELEASE_TAG']} - {release_date}"
          Path(sys.argv[1]).write_text(f"{heading}\n\n{body}\n", encoding="utf-8")
          PY
          echo "  first release: using curated CHANGELOG.md [Unreleased] notes"

      - name: Verify release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/release-notes.md" <<'PY'
          from pathlib import Path
          import os
          import re
          import sys
          notes = Path(sys.argv[1]).read_text(encoding="utf-8").lstrip()
          release_tag = os.environ["RELEASE_TAG"]
          expected = re.compile(rf"^## {re.escape(release_tag)} - \d{{4}}-\d{{2}}-\d{{2}}$")
          first_line = notes.splitlines()[0] if notes else "<empty>"
          if expected.match(first_line) is None:
              raise SystemExit(f"Release notes heading does not match {release_tag!r}: {first_line!r}")
          print(f"  release notes heading verified: {first_line}")
          PY
      - name: Build and validate canonical source ZIP
        run: scripts/package-source-zip.sh "$RUNNER_TEMP/nixos-hyprland-vfio-source.zip"

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          sha256sum nixos-hyprland-vfio-source.zip > nixos-hyprland-vfio-source.zip.sha256

      - name: Create annotated tag for manual releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail

          # Create the annotated tag through the GitHub API. This avoids
          # relying on an unconfigured git author in the runner and avoids
          # recursively triggering the tag workflow with GITHUB_TOKEN.
          tag_object_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              --method POST \
              -f "tag=$RELEASE_TAG" \
              -f "message=Release $RELEASE_TAG" \
              -f "object=$GITHUB_SHA" \
              -f "type=commit" \
              -f "tagger[name]=github-actions[bot]" \
              -f "tagger[email]=41898282+github-actions[bot]@users.noreply.github.com" \
              -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --jq '.sha'
          )"

          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --method POST \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$tag_object_sha"

          echo "Created annotated tag $RELEASE_TAG at $GITHUB_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/nixos-hyprland-vfio-source.zip" \
            "$RUNNER_TEMP/nixos-hyprland-vfio-source.zip.sha256" \
            --verify-tag \
            --title "NixOS · Hyprland · VFIO ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
