name: CachyOS Kernel Build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel-build:
    name: Build selected kernel only
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Consume the project's Cachix kernel cache (read-only)
        # No upstream binary cache publishes this ThinLTO kernel; the
        # project's own Cachix cache populated by `cache.yml` does. A cache
        # hit proves that exact derivation already compiled in a previous
        # run, so substitution keeps this workflow an honest build check:
        # a kernel configuration or input change produces a different store
        # path, misses the cache, and compiles as before. The public key is
        # pinned in this file instead of fetched at run time so the CI trust
        # root stays reviewable in the repository.
        run: |
          sudo mkdir -p /etc/nix
          {
            echo 'extra-substituters = https://kumutuk-nixos-hyprland-vfio.cachix.org'
            echo 'extra-trusted-public-keys = kumutuk-nixos-hyprland-vfio.cachix.org-1:wgWsd619A9+2Mj+iEDABPbnIB1YqJnVJWt2D7Bv9JTQ='
          } | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon

      - name: Report available disk space
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Build only the configured kernel package
        working-directory: nixos
        run: |
          set -euo pipefail
          kernel_out="$(nix build --no-link --print-out-paths --show-trace \
            --no-update-lock-file \
            .#nixosConfigurations.nixos.config.boot.kernelPackages.kernel)"
          printf 'Built kernel output: %s\n' "$kernel_out"

      - name: Verify the lock file was not rewritten
        run: |
          if ! git diff --quiet -- nixos/flake.lock; then
            echo "::error::flake.lock changed during the kernel build."
            git --no-pager diff -- nixos/flake.lock
            exit 1
          fi
          echo "  flake.lock clean"

      - name: Report remaining disk space
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
