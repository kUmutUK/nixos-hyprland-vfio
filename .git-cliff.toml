# Release-note generation and semantic version calculation.
# The historical Turkish changelog records 1.3.8; use it only as the fallback
# starting point when no matching version tag exists in Git.
[changelog]
header = """
# Release notes

Notable changes in NixOS · Hyprland · VFIO.
"""
body = """
{% if version %}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} **(BREAKING CHANGE)**{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
protect_breaking_commits = true
tag_pattern = "^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "newest"
commit_parsers = [
  { message = "^[a-z]+(?:\\([^)]+\\))?!:", group = "Breaking Changes" },
  { body = "BREAKING CHANGE:", group = "Breaking Changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build|^ci", group = "Build & CI" },
  { message = "^style", group = "Styling" },
  { message = "^chore", group = "Maintenance" },
  { message = "^revert", group = "Reverts" },
  { message = ".*", group = "Other Changes" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.3.8"
no_increment_regex = "^(docs?|style|test|chore|ci|build)(\\([^)]*\\))?:"
